<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="247 系統監控台：即時追蹤 CPU、記憶體、硬碟、溫度與網路狀態，並提供異常檢測、歷史趨勢與執行日誌。">
    <title>247 系統監控台</title>
    <script src="{{ url_for('static', filename='vendor/chart.umd.min.js') }}"></script>
    <style>
        :root {
            --bg: #0b0f19;
            --bg-elev: #111827;
            --surface: #151c2c;
            --surface-2: #1b2438;
            --border: #232e45;
            --border-soft: #1c2639;
            --text: #e6e9f0;
            --text-muted: #8b95a9;
            --text-dim: #5d687d;
            --accent: #5b8def;
            --ok: #34d399;
            --warn: #fbbf24;
            --danger: #f87171;
            --cyan: #22d3ee;
            --violet: #a78bfa;
            --radius: 12px;
            --font: "Segoe UI", "Inter", "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
            --mono: "Cascadia Mono", "JetBrains Mono", "Consolas", "Menlo", monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { color-scheme: dark; }
        body {
            font-family: var(--font);
            background:
                radial-gradient(1200px 500px at 10% -10%, rgba(91, 141, 239, 0.10), transparent 60%),
                radial-gradient(900px 400px at 100% 0%, rgba(167, 139, 250, 0.07), transparent 60%),
                var(--bg);
            background-attachment: fixed;
            color: var(--text);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }
        .num { font-variant-numeric: tabular-nums; }
        [hidden] { display: none !important; }

        /* ---------- Top bar ---------- */
        .topbar {
            position: sticky; top: 0; z-index: 10;
            backdrop-filter: blur(12px);
            background: rgba(11, 15, 25, 0.8);
            border-bottom: 1px solid var(--border-soft);
        }
        .topbar-inner {
            max-width: 1280px; margin: 0 auto;
            padding: 0.9rem 1.5rem;
            display: flex; align-items: center; justify-content: space-between; gap: 1rem;
        }
        .brand { display: flex; align-items: center; gap: 0.75rem; }
        .brand-icon {
            width: 36px; height: 36px; border-radius: 10px;
            display: grid; place-items: center;
            background: linear-gradient(135deg, var(--accent), var(--violet));
            box-shadow: 0 4px 14px rgba(91, 141, 239, 0.35);
        }
        .brand-icon svg { width: 20px; height: 20px; stroke: #fff; }
        h1 { font-size: 1.05rem; font-weight: 600; letter-spacing: -0.01em; }
        .brand-sub { font-size: 0.75rem; color: var(--text-muted); }
        .topbar-right { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; justify-content: flex-end; }
        .meta { font-size: 0.78rem; color: var(--text-muted); }
        .meta b { color: var(--text); font-weight: 500; }

        .btn {
            font: inherit; font-size: 0.78rem; font-weight: 500;
            display: inline-flex; align-items: center; gap: 0.4rem;
            padding: 0.35rem 0.8rem; border-radius: 8px;
            border: 1px solid var(--border); background: var(--surface);
            color: var(--text); cursor: pointer; transition: all 0.15s;
        }
        .btn:hover { border-color: #31405f; background: var(--surface-2); }
        .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .btn svg { width: 14px; height: 14px; stroke: currentColor; }
        .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
        .btn.primary:hover { background: #4a7bde; }

        .status-pill {
            display: inline-flex; align-items: center; gap: 0.45rem;
            padding: 0.3rem 0.75rem; border-radius: 999px;
            font-size: 0.78rem; font-weight: 500;
            border: 1px solid transparent;
            transition: all 0.3s ease;
        }
        .status-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
        .status-pill.ok { color: var(--ok); background: rgba(52, 211, 153, 0.10); border-color: rgba(52, 211, 153, 0.25); }
        .status-pill.warn { color: var(--danger); background: rgba(248, 113, 113, 0.10); border-color: rgba(248, 113, 113, 0.30); }
        .status-pill.offline { color: var(--text-muted); background: rgba(139, 149, 169, 0.10); border-color: rgba(139, 149, 169, 0.25); }
        .status-pill.ok .dot { animation: pulse 2s infinite; }
        .status-pill.warn .dot { animation: pulse 1s infinite; }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 currentColor; }
            70% { box-shadow: 0 0 0 7px transparent; }
            100% { box-shadow: 0 0 0 0 transparent; }
        }

        /* ---------- Layout ---------- */
        main { max-width: 1280px; margin: 0 auto; padding: 1.5rem; display: grid; gap: 1.25rem; }
        .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.7rem; gap: 1rem; }
        .section-title {
            font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em;
            text-transform: uppercase; color: var(--text-dim);
        }

        /* ---------- KPI cards ---------- */
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 1rem; }
        .kpi {
            background: linear-gradient(180deg, var(--surface), var(--bg-elev));
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.1rem 1.2rem;
            transition: transform 0.2s ease, border-color 0.2s ease;
            position: relative; overflow: hidden;
        }
        .kpi:hover { transform: translateY(-2px); border-color: #31405f; }
        .kpi::before {
            content: ""; position: absolute; inset: 0 0 auto 0; height: 2px;
            background: var(--kpi-color, var(--accent)); opacity: 0.85;
        }
        .kpi-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.6rem; }
        .kpi-label { font-size: 0.8rem; color: var(--text-muted); font-weight: 500; display: flex; align-items: center; gap: 0.5rem; }
        .kpi-label svg { width: 16px; height: 16px; stroke: var(--kpi-color, var(--accent)); }
        .kpi-value { font-size: 1.9rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
        .kpi-value small { font-size: 0.9rem; font-weight: 500; color: var(--text-muted); margin-left: 0.2rem; }
        .kpi-sub { font-size: 0.75rem; color: var(--text-dim); margin-top: 0.25rem; min-height: 1.1em; }
        .badge {
            font-size: 0.68rem; font-weight: 600; padding: 0.12rem 0.5rem; border-radius: 999px;
            letter-spacing: 0.02em;
        }
        .badge.ok { color: var(--ok); background: rgba(52, 211, 153, 0.12); }
        .badge.warn { color: var(--danger); background: rgba(248, 113, 113, 0.14); }
        .badge.caution { color: var(--warn); background: rgba(251, 191, 36, 0.14); }
        .badge.muted { color: var(--text-muted); background: rgba(139, 149, 169, 0.14); }
        .bar { height: 6px; border-radius: 999px; background: var(--surface-2); margin-top: 0.8rem; overflow: hidden; }
        .bar > span {
            display: block; height: 100%; width: 0; border-radius: inherit;
            background: var(--kpi-color, var(--accent));
            transition: width 0.6s cubic-bezier(.2,.8,.2,1), background 0.3s;
        }
        .bar > span.warn { background: var(--danger); }
        .bar > span.caution { background: var(--warn); }

        /* ---------- Cards ---------- */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.1rem 1.2rem 1.2rem;
        }
        .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.8rem; gap: 0.5rem; }
        .card-title { font-size: 0.92rem; font-weight: 600; }
        .card-hint { font-size: 0.72rem; color: var(--text-dim); }
        .chart-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
        .chart-card-wide { grid-column: 1 / -1; }
        .chart-wrapper { position: relative; height: 200px; }
        .two-col { display: grid; grid-template-columns: 1.4fr 1fr; gap: 1rem; }
        .two-col.even { grid-template-columns: 1fr 1fr; }

        /* ---------- Segmented control ---------- */
        .segmented { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
        .segmented button {
            font: inherit; font-size: 0.74rem; font-weight: 500;
            padding: 0.25rem 0.7rem; border: none; border-radius: 6px;
            background: transparent; color: var(--text-muted); cursor: pointer; transition: all 0.15s;
        }
        .segmented button:hover { color: var(--text); }
        .segmented button.active { background: var(--accent); color: #fff; }
        .segmented button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

        /* ---------- Stat table ---------- */
        .stat-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.6rem 0; border-bottom: 1px solid var(--border-soft);
            font-size: 0.86rem;
        }
        .stat-row:last-child { border-bottom: none; }
        .stat-label { color: var(--text-muted); }
        .stat-value { font-weight: 500; display: flex; align-items: center; gap: 0.5rem; }
        .stat-value.anomaly { color: var(--danger); }

        /* ---------- Cores ---------- */
        .core-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 0.6rem; }
        .core {
            background: var(--bg-elev); border: 1px solid var(--border-soft);
            border-radius: 8px; padding: 0.5rem 0.6rem;
        }
        .core-top { display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--text-muted); }
        .core-top b { color: var(--text); font-weight: 600; }
        .core .bar { margin-top: 0.4rem; height: 4px; --kpi-color: var(--accent); }

        /* ---------- Disks ---------- */
        .disk-item { padding: 0.55rem 0; border-bottom: 1px solid var(--border-soft); }
        .disk-item:last-child { border-bottom: none; }
        .disk-top { display: flex; justify-content: space-between; font-size: 0.84rem; gap: 0.6rem; }
        .disk-mount { font-family: var(--mono); font-size: 0.8rem; word-break: break-all; }
        .disk-size { color: var(--text-muted); font-size: 0.76rem; white-space: nowrap; }
        .disk-item .bar { margin-top: 0.45rem; height: 5px; --kpi-color: #fbbf24; }

        /* ---------- Process table ---------- */
        .table-wrap { overflow-x: auto; }
        table.proc { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
        table.proc th {
            text-align: left; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.06em;
            text-transform: uppercase; color: var(--text-dim);
            padding: 0.4rem 0.6rem; border-bottom: 1px solid var(--border);
        }
        table.proc td { padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--border-soft); }
        table.proc tr:last-child td { border-bottom: none; }
        table.proc tbody tr:hover { background: rgba(255, 255, 255, 0.03); }
        table.proc .r { text-align: right; }
        .proc-name { font-weight: 500; }
        .proc-pid { color: var(--text-dim); font-family: var(--mono); font-size: 0.76rem; }

        /* ---------- Anomaly list ---------- */
        .empty-state {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 0.6rem; padding: 2rem 1rem; text-align: center;
            color: var(--text-muted); font-size: 0.86rem;
        }
        .empty-state svg { width: 40px; height: 40px; stroke: var(--ok); }
        .alert-item {
            display: flex; gap: 0.7rem; align-items: flex-start;
            padding: 0.7rem 0.8rem; margin-bottom: 0.5rem;
            background: rgba(248, 113, 113, 0.08);
            border: 1px solid rgba(248, 113, 113, 0.25);
            border-left: 3px solid var(--danger);
            border-radius: 8px; font-size: 0.85rem;
        }
        .alert-item svg { width: 18px; height: 18px; stroke: var(--danger); flex-shrink: 0; margin-top: 1px; }

        /* ---------- Log console ---------- */
        .filters { display: flex; gap: 0.35rem; }
        .filter-btn {
            font: inherit; font-size: 0.74rem; font-weight: 500;
            padding: 0.25rem 0.7rem; border-radius: 999px;
            border: 1px solid var(--border); background: transparent;
            color: var(--text-muted); cursor: pointer; transition: all 0.15s;
        }
        .filter-btn:hover { color: var(--text); border-color: #31405f; }
        .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
        .filter-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .log-console {
            background: #070a12; border: 1px solid var(--border-soft);
            border-radius: 8px; max-height: 280px; overflow-y: auto;
            font-family: var(--mono); font-size: 0.78rem;
        }
        .log-console::-webkit-scrollbar { width: 8px; }
        .log-console::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
        .log-entry {
            display: grid; grid-template-columns: 150px 58px 1fr; gap: 0.75rem;
            padding: 0.35rem 0.8rem; border-bottom: 1px solid #0d1220; align-items: baseline;
        }
        .log-entry:hover { background: rgba(255, 255, 255, 0.03); }
        .log-time { color: var(--text-dim); }
        .log-level { font-weight: 600; font-size: 0.68rem; letter-spacing: 0.04em; }
        .log-msg { color: #cbd2e0; word-break: break-word; }
        .lvl-info .log-level { color: var(--cyan); }
        .lvl-warn .log-level { color: var(--warn); }
        .lvl-error .log-level { color: var(--danger); }
        .lvl-error .log-msg { color: #fca5a5; }
        .lvl-warn .log-msg { color: #fde68a; }
        .log-empty { padding: 1.5rem; text-align: center; color: var(--text-dim); font-family: var(--font); }

        /* ---------- Settings dialog ---------- */
        dialog {
            margin: auto; width: min(440px, calc(100vw - 2rem));
            background: var(--surface); color: var(--text);
            border: 1px solid var(--border); border-radius: 14px; padding: 0;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55);
        }
        dialog::backdrop { background: rgba(5, 8, 15, 0.65); backdrop-filter: blur(3px); }
        .dialog-body { padding: 1.3rem 1.4rem; }
        .dialog-body h2 { font-size: 1.05rem; font-weight: 600; margin-bottom: 0.25rem; }
        .dialog-sub { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 1.1rem; }
        .field { display: grid; grid-template-columns: 1fr 110px; align-items: center; gap: 0.8rem; margin-bottom: 0.8rem; font-size: 0.86rem; }
        .field label small { display: block; color: var(--text-dim); font-size: 0.72rem; }
        .field input {
            font: inherit; font-size: 0.86rem; width: 100%;
            padding: 0.4rem 0.6rem; border-radius: 8px;
            border: 1px solid var(--border); background: var(--bg-elev); color: var(--text);
        }
        .field input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
        .form-error { color: var(--danger); font-size: 0.8rem; min-height: 1.2em; margin-bottom: 0.6rem; }
        .dialog-actions { display: flex; justify-content: flex-end; gap: 0.6rem; }

        footer { text-align: center; color: var(--text-dim); font-size: 0.74rem; padding: 0.5rem 0 1.8rem; }

        /* ---------- Responsive ---------- */
        @media (max-width: 1000px) {
            .two-col, .two-col.even { grid-template-columns: 1fr; }
        }
        @media (max-width: 680px) {
            .chart-grid { grid-template-columns: 1fr; }
            .log-entry { grid-template-columns: 1fr; gap: 0.1rem; }
            .topbar-inner { flex-direction: column; align-items: flex-start; }
            .topbar-right { justify-content: flex-start; }
            .section-head { flex-direction: column; align-items: flex-start; }
        }
        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand">
                <div class="brand-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                </div>
                <div>
                    <h1>247 系統監控台</h1>
                    <div class="brand-sub">24/7 System Monitoring Dashboard</div>
                </div>
            </div>
            <div class="topbar-right">
                <span class="meta">上次更新 <b class="num" id="last-updated">--:--:--</b></span>
                <span class="meta">開機時間 <b class="num" id="boot-time">--</b></span>
                <button class="btn" id="export-btn" type="button" onclick="window.location.href='/api/export?days=1'">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    匯出資料
                </button>
                <button class="btn" id="open-settings" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
                    閥值設定
                </button>
                <span class="status-pill offline" id="status-pill" role="status" aria-live="polite">
                    <span class="dot"></span><span id="status-text">連線中…</span>
                </span>
            </div>
        </div>
    </header>

    <main>
        <section aria-label="關鍵指標">
            <div class="section-head"><div class="section-title">關鍵指標</div></div>
            <div class="kpi-grid" id="summary"></div>
        </section>

        <section aria-label="趨勢圖表">
            <div class="section-head">
                <div class="section-title">趨勢分析</div>
                <div class="segmented" role="group" aria-label="時間範圍" id="range-group">
                    <button type="button" data-minutes="5" id="range-5">5 分鐘</button>
                    <button type="button" data-minutes="15" id="range-15">15 分鐘</button>
                    <button type="button" data-minutes="60" id="range-60">1 小時</button>
                    <button type="button" data-minutes="360" id="range-360">6 小時</button>
                    <button type="button" data-minutes="1440" id="range-1440">24 小時</button>
                </div>
            </div>
            <div class="chart-grid">
                <div class="card">
                    <div class="card-head"><span class="card-title">CPU 使用率</span><span class="card-hint">%</span></div>
                    <div class="chart-wrapper"><canvas id="chart-cpu" aria-label="CPU 使用率趨勢圖" role="img"></canvas></div>
                </div>
                <div class="card">
                    <div class="card-head"><span class="card-title">記憶體使用率</span><span class="card-hint">%</span></div>
                    <div class="chart-wrapper"><canvas id="chart-mem" aria-label="記憶體使用率趨勢圖" role="img"></canvas></div>
                </div>
                <div class="card">
                    <div class="card-head"><span class="card-title">網路發送速率</span><span class="card-hint">KB/s</span></div>
                    <div class="chart-wrapper"><canvas id="chart-netSent" aria-label="網路發送速率趨勢圖" role="img"></canvas></div>
                </div>
                <div class="card">
                    <div class="card-head"><span class="card-title">網路接收速率</span><span class="card-hint">KB/s</span></div>
                    <div class="chart-wrapper"><canvas id="chart-netRecv" aria-label="網路接收速率趨勢圖" role="img"></canvas></div>
                </div>
                <div class="card chart-card-wide" id="temp-card" hidden>
                    <div class="card-head"><span class="card-title">CPU 溫度</span><span class="card-hint">°C</span></div>
                    <div class="chart-wrapper"><canvas id="chart-temp" aria-label="CPU 溫度趨勢圖" role="img"></canvas></div>
                </div>
            </div>
        </section>

        <section class="two-col even" aria-label="核心與磁碟">
            <div class="card">
                <div class="card-head"><span class="card-title">CPU 各核心使用率</span><span class="card-hint" id="core-hint"></span></div>
                <div class="core-grid" id="core-list"></div>
            </div>
            <div class="card">
                <div class="card-head"><span class="card-title">磁碟分割區</span><span class="card-hint" id="disk-hint"></span></div>
                <div id="disk-list"></div>
            </div>
        </section>

        <section class="card" aria-label="高負載程序">
            <div class="card-head"><span class="card-title">高負載程序</span><span class="card-hint">依 CPU 使用率排序（佔整機百分比）</span></div>
            <div class="table-wrap">
                <table class="proc">
                    <thead><tr><th>程序</th><th>PID</th><th class="r">CPU</th><th class="r">記憶體</th></tr></thead>
                    <tbody id="proc-list"></tbody>
                </table>
            </div>
        </section>

        <section class="two-col" aria-label="詳情與異常">
            <div class="card">
                <div class="card-head"><span class="card-title">系統資源詳情</span></div>
                <div id="stats-card"><div class="stat-row"><span class="stat-label">載入中…</span></div></div>
            </div>
            <div class="card">
                <div class="card-head"><span class="card-title">異常檢測</span><span class="badge ok" id="anomaly-badge">正常</span></div>
                <div id="anomaly-list"></div>
            </div>
        </section>

        <section class="card" aria-label="執行日誌">
            <div class="card-head">
                <span class="card-title">執行日誌</span>
                <div class="filters" role="group" aria-label="日誌篩選">
                    <button class="filter-btn active" data-filter="all" id="filter-all" type="button">全部</button>
                    <button class="filter-btn" data-filter="info" id="filter-info" type="button">資訊</button>
                    <button class="filter-btn" data-filter="warn" id="filter-warn" type="button">警告</button>
                    <button class="filter-btn" data-filter="error" id="filter-error" type="button">錯誤</button>
                </div>
            </div>
            <div class="log-console" id="log-list"></div>
        </section>

        <footer>資料每 5 秒自動更新</footer>
    </main>

    <dialog id="settings-dialog" aria-labelledby="settings-title">
        <form class="dialog-body" id="settings-form" method="dialog" novalidate>
            <h2 id="settings-title">異常閥值設定</h2>
            <p class="dialog-sub">超過閥值會標示為異常，並透過已設定的管道發送通知。</p>
            <div class="field"><label for="th-cpu_percent">CPU 使用率<small>1 – 100 %</small></label><input type="number" id="th-cpu_percent" name="cpu_percent" min="1" max="100" step="1" required></div>
            <div class="field"><label for="th-memory_percent">記憶體使用率<small>1 – 100 %</small></label><input type="number" id="th-memory_percent" name="memory_percent" min="1" max="100" step="1" required></div>
            <div class="field"><label for="th-disk_percent">磁碟使用率<small>1 – 100 %</small></label><input type="number" id="th-disk_percent" name="disk_percent" min="1" max="100" step="1" required></div>
            <div class="field"><label for="th-temp_celsius">CPU 溫度<small>20 – 150 °C</small></label><input type="number" id="th-temp_celsius" name="temp_celsius" min="20" max="150" step="1" required></div>
            <div class="form-error" id="settings-error" role="alert"></div>
            <div class="dialog-actions">
                <button class="btn" type="button" id="settings-cancel">取消</button>
                <button class="btn primary" type="submit" id="settings-save">儲存</button>
            </div>
        </form>
    </dialog>

    <script>
        const REFRESH_MS = 5000;
        const RANGE_KEY = "monitor.rangeMinutes";
        const VALID_RANGES = [5, 15, 60, 360, 1440];
        const COLORS = { cpu: "#5b8def", mem: "#a78bfa", netSent: "#22d3ee", netRecv: "#34d399", temp: "#fb923c", disk: "#fbbf24" };

        const svg = function(path) {
            return '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + path + '</svg>';
        };
        const ICONS = {
            temp: svg('<path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/>'),
            cpu: svg('<rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/>'),
            mem: svg('<rect x="2" y="7" width="20" height="10" rx="2"/><path d="M6 11v2M10 11v2M14 11v2M18 11v2"/>'),
            disk: svg('<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.7-4 3-9 3s-9-1.3-9-3"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5"/>'),
            net: svg('<path d="M7 17l-4-4 4-4M3 13h14M17 7l4 4-4 4M21 11H7"/>'),
            alert: svg('<path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>'),
            check: svg('<circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6"/>'),
        };

        const WARN_MARK = "⚠️";
        const state = {
            logs: [], filter: "all", minutes: loadRange(),
            thresholds: { cpu_percent: 85, memory_percent: 85, disk_percent: 90, temp_celsius: 80 },
        };

        function loadRange() {
            const saved = parseInt(localStorage.getItem(RANGE_KEY), 10);
            return VALID_RANGES.indexOf(saved) >= 0 ? saved : 15;
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, function(c) {
                return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
            });
        }
        function cleanValue(v) { return String(v).replace(WARN_MARK, "").trim(); }
        function parseNumber(v) { const n = parseFloat(cleanValue(v)); return isNaN(n) ? null : n; }

        function levelFor(value, threshold) {
            if (value === null) return "ok";
            if (value >= threshold) return "warn";
            if (value >= threshold * 0.8) return "caution";
            return "ok";
        }
        const LEVEL_TEXT = { ok: "正常", caution: "偏高", warn: "異常" };
        const barClass = function(lvl) { return lvl === "ok" ? "" : lvl; };

        /* ---------- Charts ---------- */
        const charts = {};
        const CHART_DEFS = {
            cpu: { label: "CPU 使用率 (%)", color: COLORS.cpu, max: 100, unit: "%", key: "cpu" },
            mem: { label: "記憶體使用率 (%)", color: COLORS.mem, max: 100, unit: "%", key: "memory" },
            netSent: { label: "發送速率 (KB/s)", color: COLORS.netSent, unit: " KB/s", key: "net_sent_kbps" },
            netRecv: { label: "接收速率 (KB/s)", color: COLORS.netRecv, unit: " KB/s", key: "net_recv_kbps" },
            temp: { label: "CPU 溫度 (°C)", color: COLORS.temp, unit: "°C", key: "temp" },
        };

        function hexToRgba(hex, alpha) {
            const n = parseInt(hex.slice(1), 16);
            return "rgba(" + (n >> 16 & 255) + "," + (n >> 8 & 255) + "," + (n & 255) + "," + alpha + ")";
        }

        function initCharts() {
            Chart.defaults.font.family = '"Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif';
            Chart.defaults.color = "#8b95a9";
            Object.keys(CHART_DEFS).forEach(function(id) {
                const def = CHART_DEFS[id];
                const ctx = document.getElementById("chart-" + id).getContext("2d");
                const gradient = ctx.createLinearGradient(0, 0, 0, 200);
                gradient.addColorStop(0, hexToRgba(def.color, 0.35));
                gradient.addColorStop(1, hexToRgba(def.color, 0));
                charts[id] = new Chart(ctx, {
                    type: "line",
                    data: {
                        labels: [],
                        datasets: [{
                            label: def.label, data: [],
                            borderColor: def.color, backgroundColor: gradient,
                            borderWidth: 2, pointRadius: 0, pointHoverRadius: 4,
                            pointHoverBackgroundColor: def.color,
                            fill: true, tension: 0.35, spanGaps: false,
                        }],
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false, animation: false,
                        interaction: { mode: "index", intersect: false },
                        scales: {
                            y: {
                                beginAtZero: true,
                                ...(def.max ? { max: def.max } : {}),
                                grid: { color: "rgba(139, 149, 169, 0.10)" },
                                border: { display: false },
                                ticks: { font: { size: 10 }, maxTicksLimit: 5 },
                            },
                            x: {
                                grid: { display: false },
                                border: { display: false },
                                ticks: { font: { size: 10 }, maxRotation: 0, maxTicksLimit: 6 },
                            },
                        },
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                backgroundColor: "#0b0f19", borderColor: "#232e45", borderWidth: 1,
                                titleColor: "#e6e9f0", bodyColor: "#cbd2e0", padding: 10, displayColors: false,
                                callbacks: {
                                    label: function(c) { return c.parsed.y === null ? "—" : c.parsed.y.toFixed(1) + def.unit; },
                                },
                            },
                        },
                    },
                });
            });
        }

        function updateCharts(history) {
            const temps = history.temp || [];
            document.getElementById("temp-card").hidden = !temps.some(function(v) { return v !== null; });
            Object.keys(charts).forEach(function(id) {
                charts[id].data.labels = history.timestamps;
                charts[id].data.datasets[0].data = history[CHART_DEFS[id].key] || [];
                charts[id].update("none");
            });
        }

        /* ---------- KPI ---------- */
        function kpiGauge(opts) {
            const n = parseNumber(opts.value);
            const lvl = levelFor(n, opts.threshold);
            const pct = n === null ? 0 : Math.min(n, 100);
            return '<div class="kpi" style="--kpi-color:' + opts.color + '">' +
                '<div class="kpi-head"><span class="kpi-label">' + ICONS[opts.icon] + escapeHtml(opts.label) + '</span>' +
                '<span class="badge ' + lvl + '">' + LEVEL_TEXT[lvl] + '</span></div>' +
                '<div class="kpi-value num">' + (n === null ? "--" : n.toFixed(1)) + '<small>%</small></div>' +
                '<div class="kpi-sub">' + escapeHtml(opts.sub) + '</div>' +
                '<div class="bar"><span class="' + barClass(lvl) + '" style="width:' + pct + '%"></span></div></div>';
        }

        function kpiTemp(stats, thresholds, source) {
            const n = parseNumber(stats["CPU 溫度"] || "-");
            const limit = thresholds.temp_celsius;
            const lvl = levelFor(n, limit);
            const badge = n === null ? '<span class="badge muted">無資料</span>'
                : '<span class="badge ' + lvl + '">' + LEVEL_TEXT[lvl] + '</span>';
            const sub = n === null ? "未偵測到感測器（參閱 README）"
                : "來源 " + (source || "-") + " · 閥值 " + limit + "°C";
            const pct = n === null ? 0 : Math.min(n, 100);
            return '<div class="kpi" style="--kpi-color:' + COLORS.temp + '">' +
                '<div class="kpi-head"><span class="kpi-label">' + ICONS.temp + 'CPU 溫度</span>' + badge + '</div>' +
                '<div class="kpi-value num">' + (n === null ? "N/A" : n.toFixed(1) + '<small>°C</small>') + '</div>' +
                '<div class="kpi-sub">' + escapeHtml(sub) + '</div>' +
                '<div class="bar"><span class="' + barClass(lvl) + '" style="width:' + pct + '%"></span></div></div>';
        }

        function kpiNet(stats) {
            const recv = cleanValue(stats["網路接收速率"] || "-");
            const sent = cleanValue(stats["網路發送速率"] || "-");
            return '<div class="kpi" style="--kpi-color:' + COLORS.netRecv + '">' +
                '<div class="kpi-head"><span class="kpi-label">' + ICONS.net + '網路流量</span>' +
                '<span class="badge ok">即時</span></div>' +
                '<div class="kpi-value num" style="font-size:1.35rem">↓ ' + escapeHtml(recv) + '</div>' +
                '<div class="kpi-sub num">↑ 發送 ' + escapeHtml(sent) + '</div>' +
                '<div class="bar"><span style="width:100%;opacity:.35"></span></div></div>';
        }

        function kpiGpu(gpu) {
            if (!gpu) return "";
            return '<div class="kpi" style="--kpi-color:#22d3ee">' +
                '<div class="kpi-head"><span class="kpi-label">' + ICONS.cpu + 'GPU</span><span class="badge ok">' + escapeHtml(gpu.name) + '</span></div>' +
                '<div class="kpi-value num">' + (gpu.gpu_percent || 0).toFixed(1) + '<small>%</small></div>' +
                '<div class="kpi-sub">記憶體 ' + gpu.memory_percent.toFixed(1) + '% · ' + (gpu.temp_c ? gpu.temp_c + '°C' : '') + '</div>' +
                '<div class="bar"><span class="' + barClass(levelFor(gpu.gpu_percent, 85)) + '" style="width:' + Math.min(gpu.gpu_percent || 0, 100) + '%"></span></div></div>';
        }

        function updateSummary(stats, thresholds, tempSource, gpu) {
            if (!stats || Object.keys(stats).length === 0) return;
            const t = thresholds;
            document.getElementById("summary").innerHTML =
                kpiGauge({ label: "CPU 使用率", icon: "cpu", color: COLORS.cpu, value: stats["CPU 使用率"] || "-", threshold: t.cpu_percent, sub: "閥值 " + t.cpu_percent + "%" }) +
                kpiGauge({ label: "記憶體使用率", icon: "mem", color: COLORS.mem, value: stats["記憶體使用率"] || "-", threshold: t.memory_percent,
                    sub: (stats["已用記憶體"] || "-") + " / " + (stats["記憶體總量"] || "-") }) +
                kpiGauge({ label: "硬碟使用率（最高）", icon: "disk", color: COLORS.disk, value: stats["硬碟使用率"] || "-", threshold: t.disk_percent, sub: "閥值 " + t.disk_percent + "%" }) +
                kpiTemp(stats, t, tempSource) +
                kpiGpu(gpu) +
                kpiNet(stats);
            document.getElementById("boot-time").textContent = stats["開機時間"] || "--";
        }


        /* ---------- Cores / disks / processes ---------- */
        function updateCores(cores, threshold) {
            document.getElementById("core-hint").textContent = cores.length ? cores.length + " 執行緒" : "";
            document.getElementById("core-list").innerHTML = cores.map(function(v, i) {
                const lvl = levelFor(v, threshold);
                return '<div class="core"><div class="core-top"><span>C' + i + '</span><b class="num">' + v.toFixed(0) + '%</b></div>' +
                    '<div class="bar"><span class="' + barClass(lvl) + '" style="width:' + Math.min(v, 100) + '%"></span></div></div>';
            }).join("") || '<div class="log-empty">暫無資料</div>';
        }

        function updateDisks(disks, threshold) {
            document.getElementById("disk-hint").textContent = disks.length ? disks.length + " 個分割區" : "";
            document.getElementById("disk-list").innerHTML = disks.map(function(d) {
                const lvl = levelFor(d.percent, threshold);
                return '<div class="disk-item"><div class="disk-top"><span class="disk-mount">' + escapeHtml(d.mount) + '</span>' +
                    '<span class="disk-size num">' + d.used_gb + ' / ' + d.total_gb + ' GB · <b>' + d.percent.toFixed(1) + '%</b></span></div>' +
                    '<div class="bar"><span class="' + barClass(lvl) + '" style="width:' + Math.min(d.percent, 100) + '%"></span></div></div>';
            }).join("") || '<div class="log-empty">暫無資料</div>';
        }

        function updateProcesses(processes) {
            document.getElementById("proc-list").innerHTML = processes.map(function(p) {
                return '<tr><td class="proc-name">' + escapeHtml(p.name) + '</td><td class="proc-pid">' + p.pid + '</td>' +
                    '<td class="r num">' + p.cpu.toFixed(1) + '%</td><td class="r num">' + p.memory.toFixed(1) + '%</td></tr>';
            }).join("") || '<tr><td colspan="4" class="log-empty">暫無資料</td></tr>';
        }

        /* ---------- Stats / anomalies ---------- */
        function updateStatsCard(stats) {
            if (!stats || Object.keys(stats).length === 0) return;
            document.getElementById("stats-card").innerHTML = Object.entries(stats).map(function(entry) {
                const isAnomaly = String(entry[1]).includes(WARN_MARK);
                return '<div class="stat-row"><span class="stat-label">' + escapeHtml(entry[0]) + '</span>' +
                    '<span class="stat-value num' + (isAnomaly ? " anomaly" : "") + '">' + escapeHtml(cleanValue(entry[1])) +
                    (isAnomaly ? '<span class="badge warn">異常</span>' : "") + '</span></div>';
            }).join("");
        }

        function updateAnomalies(anomalies) {
            const badge = document.getElementById("anomaly-badge");
            const has = anomalies && anomalies.length > 0;
            badge.className = "badge " + (has ? "warn" : "ok");
            badge.textContent = has ? anomalies.length + " 項異常" : "正常";
            document.getElementById("anomaly-list").innerHTML = has
                ? anomalies.map(function(a) {
                    return '<div class="alert-item">' + ICONS.alert + '<span>' + escapeHtml(a) + '</span></div>';
                }).join("")
                : '<div class="empty-state">' + ICONS.check + '<div>所有指標皆在正常範圍內</div></div>';
            setStatus(has ? "warn" : "ok", has ? "偵測到異常" : "運作正常");
        }

        function setStatus(kind, text) {
            document.getElementById("status-pill").className = "status-pill " + kind;
            document.getElementById("status-text").textContent = text;
        }

        /* ---------- Logs ---------- */
        function levelOf(message) {
            if (message.includes("🚨") || message.includes("❌")) return "error";
            if (message.includes(WARN_MARK)) return "warn";
            return "info";
        }
        const LEVEL_LABEL = { info: "INFO", warn: "WARN", error: "ERROR" };

        function stripEmoji(message) {
            return message.replace(/🚨|❌|⚠️/g, "").trim();
        }

        function renderLogs() {
            const el = document.getElementById("log-list");
            const rows = state.logs.filter(function(l) { return state.filter === "all" || l.level === state.filter; });
            if (rows.length === 0) {
                el.innerHTML = '<div class="log-empty">暫無日誌</div>';
                return;
            }
            el.innerHTML = rows.slice().reverse().map(function(l) {
                return '<div class="log-entry lvl-' + l.level + '">' +
                    '<span class="log-time num">' + escapeHtml(l.timestamp) + '</span>' +
                    '<span class="log-level">' + LEVEL_LABEL[l.level] + '</span>' +
                    '<span class="log-msg">' + escapeHtml(stripEmoji(l.message)) + '</span></div>';
            }).join("");
        }

        async function fetchLogs() {
            try {
                const resp = await fetch("/api/logs");
                if (!resp.ok) throw new Error("HTTP " + resp.status);
                const data = await resp.json();
                state.logs = (data.logs || []).map(function(l) {
                    return { timestamp: l.timestamp, message: l.message, level: levelOf(l.message) };
                });
                renderLogs();
            } catch (e) {
                console.error("Failed to fetch logs:", e);
            }
        }

        document.querySelectorAll(".filter-btn").forEach(function(btn) {
            btn.addEventListener("click", function() {
                state.filter = btn.dataset.filter;
                document.querySelectorAll(".filter-btn").forEach(function(b) { b.classList.toggle("active", b === btn); });
                renderLogs();
            });
        });

        /* ---------- Time range ---------- */
        function syncRangeButtons() {
            document.querySelectorAll("#range-group button").forEach(function(b) {
                b.classList.toggle("active", parseInt(b.dataset.minutes, 10) === state.minutes);
            });
        }
        document.querySelectorAll("#range-group button").forEach(function(btn) {
            btn.addEventListener("click", function() {
                state.minutes = parseInt(btn.dataset.minutes, 10);
                localStorage.setItem(RANGE_KEY, String(state.minutes));
                syncRangeButtons();
                refresh();
            });
        });

        /* ---------- Settings dialog ---------- */
        const dialog = document.getElementById("settings-dialog");
        const settingsForm = document.getElementById("settings-form");
        const settingsError = document.getElementById("settings-error");

        document.getElementById("open-settings").addEventListener("click", function() {
            Object.keys(state.thresholds).forEach(function(key) {
                const input = document.getElementById("th-" + key);
                if (input) input.value = state.thresholds[key];
            });
            settingsError.textContent = "";
            dialog.showModal();
        });
        document.getElementById("settings-cancel").addEventListener("click", function() { dialog.close(); });

        settingsForm.addEventListener("submit", async function(event) {
            event.preventDefault();
            const payload = {};
            for (const input of settingsForm.querySelectorAll("input")) {
                const value = parseFloat(input.value);
                if (isNaN(value)) { settingsError.textContent = "請填入所有數值"; return; }
                payload[input.name] = value;
            }
            try {
                const resp = await fetch("/api/thresholds", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload),
                });
                const body = await resp.json();
                if (!resp.ok) { settingsError.textContent = body.error || "儲存失敗"; return; }
                state.thresholds = body;
                dialog.close();
                refresh();
            } catch (e) {
                console.error("Save thresholds failed:", e);
                settingsError.textContent = "無法連線，請稍後再試";
            }
        });

        /* ---------- Refresh loop ---------- */
        async function refresh() {
            try {
                const resp = await fetch("/api/data?minutes=" + state.minutes);
                if (!resp.ok) throw new Error("HTTP " + resp.status);
                const data = await resp.json();
                if (data.thresholds) state.thresholds = data.thresholds;
                updateSummary(data.stats, state.thresholds, data.temp_source, data.gpu);
                updateCores(data.cores || [], state.thresholds.cpu_percent);
                updateDisks(data.disks || [], state.thresholds.disk_percent);
                updateProcesses(data.processes || []);
                updateStatsCard(data.stats);
                updateAnomalies(data.anomalies);
                updateCharts(data.history);
                document.getElementById("last-updated").textContent = new Date().toLocaleTimeString("zh-TW", { hour12: false });
                fetchLogs();
            } catch (e) {
                console.error("Refresh error:", e);
                setStatus("offline", "連線中斷");
            }
        }

        syncRangeButtons();
        initCharts();
        refresh();
        setInterval(refresh, REFRESH_MS);
    </script>
</body>
</html>
